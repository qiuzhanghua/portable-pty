name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let the toolchain auto-upgrade behind our back: go.mod is the single
  # source of truth for the minimum Go version.
  GOTOOLCHAIN: local

jobs:
  # Runs the real test suite on the three platforms we support natively.
  # This is the only job that can validate actual PTY behaviour, including the
  # Linux EIO-on-slave-close semantics that cannot be reproduced on macOS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Verify go.mod / go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set +e
          go test ./... >"$RUNNER_TEMP/test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/test.log"

          # A failing job's log cannot be read through the API without a token,
          # and then a failure reports nothing but "Process completed with exit
          # code 1". Annotations, unlike logs, are readable anonymously, so
          # repeat the useful part as ::error:: lines.
          #
          # This exists because diagnosing two windows-latest failures had to be
          # done by re-reading the code, and guessing is not a debugging method.
          if [ "$status" -ne 0 ]; then
            detail=$(grep -E -- '--- FAIL|_test\.go:[0-9]+:' "$RUNNER_TEMP/test.log" | head -12)
            if [ -z "$detail" ]; then
              # No per-test line at all means the binary died instead of
              # reporting: a crash or a timeout. The reason is at the head of
              # the dump and the verdict at the tail, so show both.
              detail=$(
                head -20 "$RUNNER_TEMP/test.log"
                echo '        ...'
                tail -20 "$RUNNER_TEMP/test.log"
              )
            fi
            printf '%s\n' "$detail" | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

  # Compiles every target platform. This is what catches build-tag mistakes in
  # the Platform split (master_unix.go / master_windows.go / unsupported stubs),
  # which a single-platform build would never notice.
  cross-compile:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported Unix
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          # ConPTY
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # Explicitly unsupported: must still compile, and is expected to
          # return ErrUnsupported at runtime.
          - { goos: solaris, goarch: amd64 }
          - { goos: aix, goarch: ppc64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go vet ./...
